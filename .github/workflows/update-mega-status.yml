name: Atualizar mega-status

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Recovery diário às 06h BRT: revalida todas as modalidades uma vez por dia.
    - cron: '0 9 * * *'

    # Grade regular 21h BRT (seg-sex): do sorteio até +150 min.
    # 21:00-23:30 BRT = 00:00-02:30 UTC do dia seguinte.
    - cron: '*/5 0-1 * * 2-6'
    - cron: '0,5,10,15,20,25,30 2 * * 2-6'

    # Grade regular 11h BRT (domingo): do sorteio até +150 min.
    # 11:00-13:30 BRT = 14:00-16:30 UTC.
    - cron: '*/5 14-15 * * 0'
    - cron: '0,5,10,15,20,25,30 16 * * 0'

    # Exceções futuras de 20h presentes no calendário canônico.
    # Cobre 20:00-20:55; a partir das 21h a grade regular do mesmo dia
    # mantém o Action vivo e o script continua filtrando por modalidade.
    - cron: '*/5 23 15 9 *'     # Lotofácil da Independência (15/09)
    - cron: '*/5 23 31 12 *'    # Mega da Virada (31/12)

  workflow_dispatch:
  pull_request:
    paths:
      - 'data/calendario-caixa.json'
      - 'scripts/update-mega-status.js'
      - '.github/workflows/update-mega-status.yml'
      - 'test/update-mega-status-schedule.test.js'

permissions:
  contents: write

jobs:
  validar-schedule:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''
      - name: Validar calendário, janelas e freshness
        run: node test/update-mega-status-schedule.test.js

  update-mega-status:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - name: Definir modo da execução
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # Recovery não depende do horário em que o runner efetivamente iniciou.
          # workflow_dispatch também força uma recuperação completa e segura.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$SCHEDULE_EXPR" = "0 9 * * *" ]; then
            echo "LOTTERY_RECOVERY=1" >> "$GITHUB_ENV"
            echo "Modo recovery habilitado"
            exit 0
          fi

          # Em runs agendados, preserve a expressão que originou a execução.
          # O script reconstrói o slot nominal do cron, evitando que atraso do
          # GitHub Actions descarte uma janela válida de sorteio.
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ -z "$SCHEDULE_EXPR" ]; then
              echo "::error::Run agendado sem github.event.schedule"
              exit 1
            fi
            echo "LOTTERY_SCHEDULE_CRON=$SCHEDULE_EXPR" >> "$GITHUB_ENV"
            echo "Cron de origem: $SCHEDULE_EXPR"
          fi

      - name: Executar script de atualização
        run: node scripts/update-mega-status.js

      - name: Verificar e enviar alterações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          candidates=(
            data/mega-status.json
            data/loterias-health.json
            data/megasena-api.json
            data/maismilionaria-api.json
            data/lotofacil-api.json
            data/quina-api.json
            data/duplasena-api.json
          )
          stageable=()
          for file in "${candidates[@]}"; do
            if [ -e "$file" ] || git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              stageable+=("$file")
            fi
          done

          if [ "${#stageable[@]}" -eq 0 ] || [ -z "$(git status --porcelain -- "${stageable[@]}")" ]; then
            echo "ℹ️ Nenhuma alteração encontrada nos snapshots das loterias"
            exit 0
          fi

          echo "✅ Alterações detectadas nos arquivos de loterias"
          git add -A -- "${stageable[@]}"

          if git diff --cached --quiet; then
            echo "ℹ️ Nenhuma alteração stageada nos snapshots das loterias"
            exit 0
          fi

          git commit -m "chore: atualizar status e snapshots das loterias [skip ci]"
          echo "📤 Enviando alterações para o repositório..."
          git push
          echo "✅ Alterações enviadas com sucesso!"
