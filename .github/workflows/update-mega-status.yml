name: Atualizar mega-status

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Baixa frequência: uma vez por hora somente entre 06h e 20h BRT.
    # A madrugada e o período pós-sorteio já são cobertos pelas janelas críticas.
    - cron: '0 9-23 * * *'
    # Dias úteis, 20:50–22:30 BRT (23:50–01:30 UTC).
    - cron: '50,55 23 * * 1-5'
    - cron: '*/5 0 * * 2-6'
    - cron: '0,5,10,15,20,25,30 1 * * 2-6'
    # Domingo, 10:50–12:30 BRT (13:50–15:30 UTC).
    - cron: '50,55 13 * * 0'
    - cron: '*/5 14 * * 0'
    - cron: '0,5,10,15,20,25,30 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mega-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''  # garante que NÃO tentará cache de deps (evita exigir lockfile)

      - name: Executar script de atualização
        run: node scripts/update-mega-status.js

      - name: Verificar e enviar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain data/mega-status.json data/loterias-health.json data/megasena-api.json data/maismilionaria-api.json data/lotofacil-api.json data/quina-api.json data/duplasena-api.json)" ]; then
            echo "✅ Alterações detectadas nos arquivos de loterias"

            git add data/mega-status.json data/loterias-health.json data/megasena-api.json data/maismilionaria-api.json data/lotofacil-api.json data/quina-api.json data/duplasena-api.json
            git commit -m "chore: atualizar status e snapshots das loterias [skip ci]"

            echo "📤 Enviando alterações para o repositório..."
            git push
            echo "✅ Alterações enviadas com sucesso!"
          else
            echo "ℹ️ Nenhuma alteração encontrada nos snapshots das loterias"
          fi
