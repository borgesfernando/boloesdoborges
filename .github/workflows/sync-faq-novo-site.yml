name: Sincronizar FAQ com novo-site

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - "faq.json"
  pull_request:
    paths:
      - '.github/workflows/sync-faq-novo-site.yml'

permissions:
  contents: write

jobs:
  validar-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boloesdoborges
        uses: actions/checkout@v7
      - name: Validar branch de destino
        shell: bash
        run: |
          set -euo pipefail
          grep -qE '^[[:space:]]+git push origin main$' .github/workflows/sync-faq-novo-site.yml
          if grep -qE '^[[:space:]]+git push origin master$' .github/workflows/sync-faq-novo-site.yml; then
            echo "::error::Comando operacional ainda aponta para branch master inexistente"
            exit 1
          fi

  sync-faq:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boloesdoborges
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Gerar faq.html a partir do faq.json
        run: |
          node scripts/generate-faq-html.js
      
      - name: Commitar faq.html se houver mudanças
        run: |
          if [ -n "$(git status --porcelain faq.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add faq.html
            git commit -m "chore: regenerar faq.html a partir do faq.json"
            git push origin main
          else
            echo "faq.html já está atualizado"
          fi

      - name: Checkout novo-site
        uses: actions/checkout@v7
        with:
          repository: borgesfernando/novo-site
          token: ${{ secrets.NOVO_SITE_SYNC_TOKEN }}
          path: novo-site
          ref: main

      - name: Copiar faq.json para novo-site
        run: |
          cp faq.json novo-site/src/data/faq.json

      - name: Commit e push se houver mudanças
        working-directory: novo-site
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/faq.json
            git commit -m "chore: sincronizar faq.json a partir do boloesdoborges"
            git push origin main
          else
            echo "Sem mudanças para sincronizar"
          fi
