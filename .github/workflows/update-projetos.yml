name: Atualizar projetos e índice público

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'site-index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar data/projetos.json
        run: node scripts/extract-projetos.js

      - name: Validar textos de sorteios contra o calendário canônico
        run: node scripts/validate-projetos-sorteios.js

      - name: Gerar e validar site-index.json
        run: node scripts/generate-site-index.js

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/projetos.json site-index.json)" ]; then
            git add data/projetos.json site-index.json
            git commit -m "chore: atualizar projetos e índice público [skip ci]"
            git push
          else
            echo "Sem mudanças a commitar"
          fi
