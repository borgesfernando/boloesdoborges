name: Calendário CAIXA (geração e validação de drift)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'data/calendario-caixa.json'
      - 'scripts/generate-calendario-caixa.js'
      - 'scripts/validate-calendario-caixa.js'
      - 'scripts/vendor/loterias-geral/calendarioCaixa.js'
      - 'test/calendario-caixa.test.js'
  pull_request:
    paths:
      - 'data/calendario-caixa.json'
      - 'scripts/generate-calendario-caixa.js'
      - 'scripts/validate-calendario-caixa.js'
      - 'scripts/vendor/loterias-geral/calendarioCaixa.js'
      - 'test/calendario-caixa.test.js'
      - '.github/workflows/calendario-caixa.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  sync-validar-calendario:
    name: Validar calendário CAIXA público
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Apps_Scripts é privado e continua sendo a autoridade canônica.
      # Este repositório público valida exclusivamente o espelho versionado
      # em scripts/vendor/loterias-geral/calendarioCaixa.js. A atualização
      # cross-repo do vendor deve chegar por commit/PR explícito; o GITHUB_TOKEN
      # deste repositório não possui acesso ao repositório privado por design.
      - name: Verificar fonte canônica vendorizada
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/vendor/loterias-geral/calendarioCaixa.js
          grep -q 'CALENDARIO_CAIXA_' scripts/vendor/loterias-geral/calendarioCaixa.js

      - name: Rodar testes locais
        shell: bash
        run: |
          node test/calendario-caixa.test.js

      - name: Validar arquivo público e detectar drift local
        id: valida
        shell: bash
        run: |
          if node scripts/validate-calendario-caixa.js; then
            echo "SEM_DRIFT=1" >> "$GITHUB_OUTPUT"
          else
            echo "SEM_DRIFT=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerar e commitar em schedule/dispatch
        if: steps.valida.outputs.SEM_DRIFT == '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/generate-calendario-caixa.js
          git add data/calendario-caixa.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(calendario): regenerar calendário CAIXA a partir do vendor canônico [skip ci]"
            git push
          else
            echo "Nada a commitar: calendário já sincronizado com o vendor."
          fi

      - name: Falhar CI no push/PR quando houver drift
        if: steps.valida.outputs.SEM_DRIFT == '0' && (github.event_name == 'push' || github.event_name == 'pull_request')
        shell: bash
        run: |
          echo "::error::data/calendario-caixa.json divergiu do vendor canônico. Rode node scripts/generate-calendario-caixa.js e commit o resultado."
          exit 1

      - name: Sanitização final (nenhum dado sensível)
        shell: bash
        run: |
          set -euo pipefail
          if grep -qEi 'planilhaId|docs\.google\.com/spreadsheets|drive\.google\.com|AIza[0-9A-Za-z_-]{30,}|ghp_[0-9A-Za-z_]{20,}|-----BEGIN' data/calendario-caixa.json; then
            echo "::error::Conteúdo sensível detectado em data/calendario-caixa.json"
            exit 1
          fi
          echo "data/calendario-caixa.json sem conteúdo sensível."
