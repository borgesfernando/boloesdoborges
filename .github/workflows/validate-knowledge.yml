name: Validar Knowledge Dataset

on:
  pull_request:
    paths:
      - "data/knowledge/**"
      - "scripts/validate-knowledge*.js"
      - "docs/knowledge*.md"
      - "docs/arquitetura-knowledge-dataset.md"
  push:
    branches: [ main ]
    paths:
      - "data/knowledge/**"
      - "scripts/validate-knowledge*.js"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar knowledge dataset
        run: node scripts/validate-knowledge.js
      - name: Testar validador
        run: node scripts/validate-knowledge.test.js
      - name: Verificar controles de falha
        run: node scripts/validate-knowledge.fixtures.test.js
      - name: Verificar alinhamento com schema
        run: node scripts/validate-knowledge-schema.test.js
      - name: Verificar guardrails sensíveis
        run: node scripts/validate-knowledge-sensitive.test.js
      - name: Verificar autoridade das fontes
        run: node scripts/validate-knowledge-authority.test.js
      - name: Verificar autoridade editorial da FAQ
        run: node scripts/validate-knowledge-faq-authority.test.js
      - name: Verificar cobertura fundacional
        run: node scripts/validate-knowledge-coverage.test.js
      - name: Verificar respostas
        run: node scripts/validate-knowledge-responses.test.js
      - name: Verificar ausência de wiring em produção
        run: node scripts/validate-knowledge-no-production-wiring.test.js
