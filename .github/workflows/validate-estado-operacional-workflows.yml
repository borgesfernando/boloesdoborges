name: Validar workflows do estado operacional

on:
  pull_request:
    paths:
      - '.github/workflows/set-*-alert.yml'
      - '.github/workflows/set-estado-operacional.yml'
      - '.github/workflows/validate-estado-operacional-workflows.yml'
      - '.github/state/estado-operacional-applied.json'
      - 'scripts/update-mensais-alert.js'
      - 'scripts/estado-operacional-cursor.js'
      - 'test/estado-operacional-workflows.test.js'
      - 'test/update-mensais-alert.test.js'
      - 'test/estado-operacional-idempotencia.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-*-alert.yml'
      - '.github/workflows/set-estado-operacional.yml'
      - '.github/workflows/validate-estado-operacional-workflows.yml'
      - '.github/state/estado-operacional-applied.json'
      - 'scripts/update-mensais-alert.js'
      - 'scripts/estado-operacional-cursor.js'
      - 'test/estado-operacional-workflows.test.js'
      - 'test/update-mensais-alert.test.js'
      - 'test/estado-operacional-idempotencia.test.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: ''
      - name: Validar contrato dos nove workflows
        run: node test/estado-operacional-workflows.test.js
      - name: Validar updater e cursor determinístico
        run: node --test test/update-mensais-alert.test.js test/estado-operacional-idempotencia.test.js
