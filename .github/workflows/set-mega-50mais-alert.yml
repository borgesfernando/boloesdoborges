name: Atualizar alerta Mega 50+

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      ativo:
        description: 'Ativar alerta? (true/false)'
        type: choice
        options:
          - 'true'
          - 'false'
        required: true
        default: 'false'
      concurso:
        description: 'Número do concurso associado à ativação'
        type: string
        required: true
      correlation_id:
        description: 'Identificador idempotente da ativação'
        type: string
        required: true
      estado:
        description: 'Estado operacional (ABERTA/FECHADA)'
        type: string
        required: false
        default: ''
      fase:
        description: 'Fase pública do projeto'
        type: string
        required: false
        default: ''
      abre_em:
        description: 'Abertura efetiva da janela (ISO)'
        type: string
        required: false
        default: ''
      fecha_em:
        description: 'Fechamento efetivo da janela (ISO)'
        type: string
        required: false
        default: ''
      timezone:
        description: 'Fuso horário da janela'
        type: string
        required: false
        default: 'America/Sao_Paulo'
      atualizado_em:
        description: 'Momento da última transição (ISO)'
        type: string
        required: false
        default: ''
      contexto_publico:
        description: 'JSON público allowlisted'
        type: string
        required: false
        default: '{}'

permissions:
  contents: write

concurrency:
  group: strategic-alert-rotation
  cancel-in-progress: false

jobs:
  set-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''
      - name: Atualizar mega-50mais-alert.json
        env:
          ALERTA_PROJETO: mega-50mais
          ALERTA_ATIVO: ${{ inputs.ativo }}
          ALERTA_CONCURSO: ${{ inputs.concurso }}
          ALERTA_CORRELATION_ID: ${{ inputs.correlation_id }}
          ALERTA_ESTADO: ${{ inputs.estado }}
          ALERTA_FASE: ${{ inputs.fase }}
          ALERTA_ABRE_EM: ${{ inputs.abre_em }}
          ALERTA_FECHA_EM: ${{ inputs.fecha_em }}
          ALERTA_TIMEZONE: ${{ inputs.timezone }}
          ALERTA_ATUALIZADO_EM: ${{ inputs.atualizado_em }}
          ALERTA_CONTEXTO_PUBLICO: ${{ inputs.contexto_publico }}
        run: node scripts/update-mensais-alert.js
      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/mega-50mais-alert.json data/strategic-alert-rotation.json data/estado-operacional.json)" ]; then
            git add data/mega-50mais-alert.json data/strategic-alert-rotation.json data/estado-operacional.json
            git commit -m "chore: atualizar alerta mega-50mais [skip ci]"
            git push
          else
            echo "Sem mudanças para sincronizar"
          fi
