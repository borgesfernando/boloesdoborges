name: Sincronizar mega-status com novo-site

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'data/mega-status.json'
  workflow_run:
    workflows:
      - Atualizar mega-status
    types:
      - completed
  pull_request:
    paths:
      - '.github/workflows/sync-mega-status-novo-site.yml'

permissions:
  contents: write

jobs:
  validar-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boloesdoborges
        uses: actions/checkout@v7
      - name: Validar branch de destino
        shell: bash
        run: |
          set -euo pipefail
          grep -qE '^[[:space:]]+git push origin main$' .github/workflows/sync-mega-status-novo-site.yml
          if grep -qE '^[[:space:]]+git push origin master$' .github/workflows/sync-mega-status-novo-site.yml; then
            echo "::error::Comando operacional ainda aponta para branch master inexistente"
            exit 1
          fi

  sync-mega-status:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boloesdoborges
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout novo-site
        uses: actions/checkout@v7
        with:
          repository: borgesfernando/novo-site
          token: ${{ secrets.NOVO_SITE_SYNC_TOKEN }}
          path: novo-site

      - name: Copiar mega-status.json para novo-site
        run: |
          cp data/mega-status.json novo-site/src/data/mega-status.json

      - name: Commit e push se houver mudanças
        working-directory: novo-site
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain src/data/mega-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/mega-status.json
            git commit -m "chore: sincronizar mega-status a partir do boloesdoborges"
            git push origin main
          else
            echo "Sem mudanças para sincronizar"
          fi
