name: Home visual restoration CI

on:
  pull_request:
    paths:
      - 'index.html'
      - 'test/home-visual-restore.test.js'
      - '.github/workflows/home-visual-restore-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate homepage presentation and commercial boundary
        run: node --test test/home-visual-restore.test.js
