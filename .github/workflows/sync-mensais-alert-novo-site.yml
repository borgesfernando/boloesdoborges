name: Sincronizar alertas e estado operacional com novo-site

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'data/ds-mensal-alert.json'
      - 'data/quina-mensal-alert.json'
      - 'data/lf-mensal-alert.json'
      - 'data/mega-50mais-alert.json'
      - 'data/milionaria-alert.json'
      - 'data/lf-independencia-alert.json'
      - 'data/quina-saojoao-alert.json'
      - 'data/ds-pascoa-alert.json'
      - 'data/mega-virada-alert.json'
      - 'data/estado-operacional.json'
  workflow_run:
    workflows:
      - Atualizar alerta Quina Mensal
      - Atualizar alerta Lotofácil Mensal
      - Atualizar alerta Dupla Sena Mensal
      - Atualizar alerta Mega 50+
      - Atualizar alerta Milionária
      - Atualizar alerta Lotofácil da Independência
      - Atualizar alerta Quina de São João
      - Atualizar alerta Dupla Sena de Páscoa
      - Atualizar alerta Mega da Virada
    types:
      - completed

permissions:
  contents: read

jobs:
  sync-alert:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout boloesdoborges
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout novo-site
        uses: actions/checkout@v7
        with:
          repository: borgesfernando/novo-site
          token: ${{ secrets.NOVO_SITE_SYNC_TOKEN }}
          path: novo-site
          ref: main

      - name: Copiar alertas e agregado para novo-site
        run: |
          cp data/ds-mensal-alert.json novo-site/src/data/ds-mensal-alert.json
          cp data/quina-mensal-alert.json novo-site/src/data/quina-mensal-alert.json
          cp data/lf-mensal-alert.json novo-site/src/data/lf-mensal-alert.json
          cp data/mega-50mais-alert.json novo-site/src/data/mega-50mais-alert.json
          cp data/milionaria-alert.json novo-site/src/data/milionaria-alert.json
          cp data/lf-independencia-alert.json novo-site/src/data/lf-independencia-alert.json
          cp data/quina-saojoao-alert.json novo-site/src/data/quina-saojoao-alert.json
          cp data/ds-pascoa-alert.json novo-site/src/data/ds-pascoa-alert.json
          cp data/mega-virada-alert.json novo-site/src/data/mega-virada-alert.json
          cp data/estado-operacional.json novo-site/src/data/estado-operacional.json

      - name: Commit e push se houver mudanças
        working-directory: novo-site
        run: |
          PATHS="src/data/ds-mensal-alert.json src/data/quina-mensal-alert.json src/data/lf-mensal-alert.json src/data/mega-50mais-alert.json src/data/milionaria-alert.json src/data/lf-independencia-alert.json src/data/quina-saojoao-alert.json src/data/ds-pascoa-alert.json src/data/mega-virada-alert.json src/data/estado-operacional.json"
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $PATHS
            git commit -m "chore: sincronizar estado operacional a partir do boloesdoborges"
            git push origin main
          else
            echo "Sem mudanças para sincronizar"
          fi
